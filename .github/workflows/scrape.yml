name: Daily OSINT & Census Scrape

on:
  schedule:
    - cron: '17 5 * * *'  # nightly, ~12:17am Eastern (UTC cron; off the top of the hour)
  workflow_dispatch:      # run manually from the Actions tab

permissions:
  contents: write         # lets the job commit the refreshed data files

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-data.txt

      - name: Install dependencies
        run: pip install -r requirements-data.txt

      - name: Refresh data
        run: python update_data.py
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nova_data.parquet vulnerability_data.parquet tracts.geojson
          git commit -m "Auto-update: venue & vulnerability data" || exit 0
          git pull --rebase origin main
          git push
